# Reviewed audit exceptions; every other high/critical advisory fails CI.
# GHSA-mrhx-c7xc-m3w5 (CVE-2023-54404): zod < 4.6.6 can exhaust memory validating
# oversized collections. It is fixed only in zod 4, a major upgrade shared with
# the backend contracts, and the storefront validates forms in the shopper's own
# browser. Remove after the zod 4 upgrade; keep .trivyignore in sync.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
