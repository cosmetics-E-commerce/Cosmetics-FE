name: Storefront CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: storefront-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact=100
      - name: Audit production dependencies
        id: npm_audit
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: pnpm audit --prod --audit-level high
      - name: Scan dependencies when the npm audit service is unavailable
        if: ${{ github.event_name == 'pull_request' && steps.npm_audit.outcome == 'failure' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          skip-dirs: node_modules,vendor,.git,.output,dist
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: storefront-playwright-report
          path: playwright-report
          if-no-files-found: ignore
